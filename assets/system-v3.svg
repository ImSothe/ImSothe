<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250">
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .arise{animation:arise 6s ease-in-out infinite}
    .sel{animation:sel 6s ease-in-out infinite}
    .glow{animation:glow 2s ease-in-out infinite}
    @keyframes arise{0%,18%{opacity:0;letter-spacing:4px}34%,76%{opacity:1;letter-spacing:14px}90%,100%{opacity:0;letter-spacing:18px}}
    @keyframes sel{0%,18%{opacity:0}34%,76%{opacity:1}90%,100%{opacity:0}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1426"/><stop offset="1" stop-color="#0a0d18"/></linearGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset=".5" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient>
    <filter id="b" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g>
    <rect x="40" y="16" width="640" height="218" rx="4" fill="#7c5cff" filter="url(#b)" class="glow"/>
    <rect x="40" y="16" width="640" height="218" rx="4" fill="url(#bg)" stroke="#a594ff" stroke-width="1.5"/>
    <rect x="46" y="22" width="628" height="206" rx="2" fill="none" stroke="#a594ff" stroke-opacity=".25"/>
    <text x="360" y="58" text-anchor="middle" class="m" font-size="14" letter-spacing="6" fill="#c3b8ff">[ SYSTEM ]</text>
    <line x1="250" y1="72" x2="470" y2="72" stroke="#a594ff" stroke-opacity=".35"/>
    <text x="360" y="108" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" letter-spacing="2" fill="#b7a9ff">Are you sure you want to continue?</text>
    <g class="sel">
      <rect x="170" y="140" width="380" height="54" fill="url(#hl)"/>
      <line x1="170" y1="140" x2="550" y2="140" stroke="#a594ff" stroke-opacity=".6"/>
      <line x1="170" y1="194" x2="550" y2="194" stroke="#a594ff" stroke-opacity=".6"/>
      <text x="200" y="176" class="m" font-size="18" fill="#c3b8ff">▶</text>
      <text x="508" y="176" class="m" font-size="18" fill="#c3b8ff">◀</text>
    </g>
    <text x="360" y="178" text-anchor="middle" class="t arise" font-size="28" font-weight="700" fill="#ffffff">ARISE</text>
  </g>
</svg>
